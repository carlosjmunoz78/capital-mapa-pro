name: CEREBRO Continuous Improvement Runtime V0

on:
  pull_request:
    paths:
      - "cerebro-os/learning/continuous_improvement_runtime.py"
      - "tests/test_continuous_improvement_runtime.py"
      - ".github/workflows/cerebro-continuous-improvement-runtime-v0.yml"
  push:
    branches:
      - cerebro-continuous-improvement-runtime-v0

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall cerebro-os
      - name: Runtime semantics
        run: python -m unittest -v tests/test_continuous_improvement_runtime.py tests/test_continuous_improvement.py
