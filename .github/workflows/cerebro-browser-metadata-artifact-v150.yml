name: CEREBRO Browser Metadata Recovery v1.5 Artifact
on:
  push:
    branches:
      - feat/browser-metadata-artifact-v150
    paths:
      - .github/workflows/cerebro-browser-metadata-artifact-v150.yml
      - cerebro-os/identity/windows/recovery_v1_5/**
      - cerebro-os/jobs/build_browser_metadata_recovery_v150.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PowerShell 5.1 installer syntax
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $p = "cerebro-os/identity/windows/recovery_v1_5/Install-CerebroBrowserMetadataRecovery.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; exit 1 }
      - name: Build deterministic zero-secret archive
        shell: pwsh
        run: python cerebro-os/jobs/build_browser_metadata_recovery_v150.py
      - name: Validate ZIP manifest and restricted permissions
        shell: pwsh
        run: |
          @'
          import hashlib,json,zipfile
          from pathlib import Path
          p=Path(".cerebro-runtime/packages/CEREBRO_BROWSER_METADATA_RECOVERY_V1_5_0.zip")
          assert p.is_file()
          expected={"INSTALL_AND_VERIFY.bat","Install-CerebroBrowserMetadataRecovery.ps1","ROLLBACK.bat","README.txt","payload-sha256.json","payload/CerebroBrowserBridgeService.ps1","payload/CerebroBrowserTransport.ps1","payload/chrome_extension_v1_4_1/manifest.json","payload/chrome_extension_v1_4_1/service_worker.js"}
          with zipfile.ZipFile(p) as z:
              assert set(z.namelist())==expected
              hashes=json.loads(z.read("payload-sha256.json"))
              for name,digest in hashes.items(): assert hashlib.sha256(z.read("payload/"+name)).hexdigest()==digest
              m=json.loads(z.read("payload/chrome_extension_v1_4_1/manifest.json"))
              assert m["host_permissions"]==["http://127.0.0.1/*","https://example.com/*"]
              assert m["permissions"]==["alarms"]
              assert m["version"]=="1.5.0"
              for name in z.namelist(): assert not any(x in name.lower() for x in ["pairing_once","credential","token","secret"])
          print("PACKAGE_VALIDATED",p,"SHA256",hashlib.sha256(p.read_bytes()).hexdigest())
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: CEREBRO_BROWSER_METADATA_RECOVERY_V1_5_0
          path: .cerebro-runtime/packages/CEREBRO_BROWSER_METADATA_RECOVERY_V1_5_0.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
