name: CEREBRO Improvement Checkpoint V0
on:
  pull_request:
    paths:
      - "cerebro-os/learning/improvement_checkpoint_store.py"
      - "tests/test_improvement_checkpoint_store.py"
      - ".github/workflows/cerebro-improvement-checkpoint-v0.yml"
  push:
    branches: [cerebro-improvement-checkpoint-v0]
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests/test_improvement_checkpoint_store.py tests/test_continuous_improvement_runner.py tests/test_continuous_improvement_runtime.py
