name: CEREBRO Improvement Fleet Durable V0
on:
  pull_request:
    paths:
      - "cerebro-os/jobs/improvement_fleet.py"
      - "cerebro-os/jobs/continuous_improvement_runner.py"
      - "cerebro-os/observability/improvement_cycle_summary.py"
      - "tests/test_improvement_fleet_durable.py"
      - ".github/workflows/cerebro-improvement-fleet-durable-v0.yml"
  push:
    branches: [cerebro-improvement-fleet-durable-v0]
permissions:
  contents: read
jobs:
  durable-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests/test_improvement_fleet_durable.py tests/test_improvement_fleet.py tests/test_improvement_observability_supervisor.py tests/test_improvement_resume.py
