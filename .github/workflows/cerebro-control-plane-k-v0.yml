name: CEREBRO Control Plane K V0
on:
  pull_request:
    paths:
      - "cerebro-os/jobs/build_control_plane_snapshot.py"
      - "tests/test_control_plane_k.py"
      - ".github/workflows/cerebro-control-plane-k-v0.yml"
  push:
    branches: [cerebro-control-plane-k-v0]
permissions:
  contents: read
jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests/test_control_plane_k.py
