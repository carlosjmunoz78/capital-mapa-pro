name: CEREBRO Live Integration Audit V0
on:
  pull_request:
    paths:
      - "cerebro-os/evidence/LIVE_INTEGRATION_HEALTH_2026-09-19.json"
      - "cerebro-os/observability/live_integration_health.py"
      - "tests/test_live_integration_health.py"
      - ".github/workflows/cerebro-live-integration-audit-v0.yml"
  push:
    branches: [cerebro-live-integration-audit-v0]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests/test_live_integration_health.py
