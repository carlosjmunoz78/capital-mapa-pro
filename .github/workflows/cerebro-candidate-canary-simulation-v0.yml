name: CEREBRO Candidate Canary Simulation V0
on:
  pull_request:
    paths:
      - "cerebro-os/jobs/simulate_improvement_candidate_canary.py"
      - "cerebro-os/jobs/continuous_improvement_entrypoint.py"
      - "tests/test_improvement_candidate_canary.py"
      - ".github/workflows/cerebro-candidate-canary-simulation-v0.yml"
  push:
    branches: [cerebro-candidate-canary-simulation-v0]
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests/test_improvement_candidate_canary.py tests/test_improvement_candidate_old_vs_new.py tests/test_improvement_candidate_tribunal.py tests/test_continuous_improvement_entrypoint.py
