name: B2B-PROSPECT-001 regional public directory lookup LAB
on:
  push:
    branches:
      - cerebro/b2b-prospect001-continuity-lab-20261119
    paths:
      - .github/workflows/b2b-prospect001-dir-regional-lab.yml
permissions:
  contents: read
jobs:
  region-public-listing:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m pip install --quiet --disable-pip-version-check beautifulsoup4
      - run: python3 -u cerebro-os/engines/B2B-PROSPECT-001/scripts/collect_public_listing_regional.py
