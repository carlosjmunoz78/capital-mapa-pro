name: NEWS001 · official RSS observer safe LAB
on:
  workflow_dispatch:
  push:
    branches: [cerebro/news001-single-optin-lab-20261118]
    paths:
      - 'cerebro-os/engines/CEREBRO-NEWS-001/official-observer/**'
      - '.github/workflows/news001-official-observer-lab.yml'
permissions:
  contents: read
jobs:
  observer-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test official-feed whitelist, source freshness and failure-closed
        run: cd cerebro-os/engines/CEREBRO-NEWS-001/official-observer && python3 -m unittest -v
