name: CEREBRO Business Simulation V0
on:
  pull_request:
    paths:
      - "cerebro-os/jobs/simulate_business_rules.py"
      - "tests/test_business_simulation.py"
      - ".github/workflows/cerebro-business-simulation-v0.yml"
  push:
    branches: [cerebro-sim-business-replay-v0]
permissions:
  contents: read
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests/test_business_simulation.py
