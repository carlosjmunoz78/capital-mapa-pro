name: CEREBRO Company Onboarding V0
on:
  pull_request:
    paths:
      - "cerebro-os/jobs/company_onboarding_orchestrator.py"
      - "cerebro-os/jobs/scan_company_digital_footprint.py"
      - "cerebro-os/jobs/discover_business_model.py"
      - "cerebro-os/jobs/discover_company_processes.py"
      - "cerebro-os/jobs/audit_company_website.py"
      - "cerebro-os/jobs/discover_company_keywords.py"
      - "cerebro-os/jobs/audit_company_social.py"
      - "cerebro-os/jobs/audit_company_local_presence.py"
      - "cerebro-os/jobs/map_company_competitors.py"
      - "cerebro-os/jobs/bootstrap_company_knowledge.py"
      - "cerebro-os/jobs/bootstrap_company_seo.py"
      - "cerebro-os/jobs/bootstrap_company_social.py"
      - "cerebro-os/jobs/bootstrap_company_marketing.py"
      - "cerebro-os/jobs/activate_company_engine_matrix.py"
      - "tests/test_company_onboarding_v0.py"
      - ".github/workflows/cerebro-company-onboarding-v0.yml"
  push:
    branches:
      - cerebro-company-onboarding-v0
      - cerebro-discovery-bmd-proc-waud-kw-v0
      - cerebro-discovery-social-local-compet-kboot-v0
      - cerebro-planning-seo-social-marketing-engact-v0
permissions:
  contents: read
jobs:
  onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests/test_company_onboarding_v0.py
