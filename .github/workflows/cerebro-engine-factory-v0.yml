name: CEREBRO Engine Factory V0

on:
  push:
    branches:
      - cerebro-engine-factory-v0
  pull_request:
    paths:
      - 'cerebro-os/**'
      - '.github/workflows/cerebro-engine-factory-v0.yml'

permissions:
  contents: read

concurrency:
  group: cerebro-engine-factory-v0-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s cerebro-os/tests -v
      - name: Runtime boot and rollback rehearsal
        run: python cerebro-os/runtime/runtime_rehearsal.py
      - name: Non-destructive release rollback rehearsal
        run: python cerebro-os/runtime/release_rollback_rehearsal.py
      - name: Smoke scaffold
        run: |
          tmpdir="$(mktemp -d)"
          python cerebro-os/factory/factory.py SMOKE-001 "Smoke Engine" "$tmpdir"
          test -f "$tmpdir/engines/SMOKE-001/manifest.json"
      - name: Physical isolated PREPROD container rehearsal
        run: |
          docker build -f cerebro-os/preprod/Dockerfile -t cerebro-advisory-preprod:${GITHUB_SHA} .
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e CEREBRO_ENV=PREPROD \
            -e CEREBRO_PREPROD_MODE=ephemeral_rehearsal \
            -e CEREBRO_EXTERNAL_WRITES=disabled \
            -e CEREBRO_APP_CRM_ACCESS=disabled \
            -e CEREBRO_PROD_CREDENTIALS=disabled \
            -e CEREBRO_CUSTOMER_DATA=disabled \
            cerebro-advisory-preprod:${GITHUB_SHA}
