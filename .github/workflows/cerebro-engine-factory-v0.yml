name: CEREBRO Engine Factory V0

on:
  push:
    branches:
      - cerebro-engine-factory-v0
  pull_request:
    paths:
      - 'cerebro-os/**'
      - '.github/workflows/cerebro-engine-factory-v0.yml'
      - '.github/workflows/cerebro-forge-preprod.yml'

permissions:
  contents: read

concurrency:
  group: cerebro-engine-factory-v0-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-browser-transport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse Browser Bridge recovery scripts in Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(
            'cerebro-os/identity/windows/CerebroBrowserTransport.ps1',
            'cerebro-os/identity/windows/Start-CerebroBrowserTransport.ps1',
            'cerebro-os/identity/windows/recovery_v1_4_2/Install-CerebroBrowserTransportRecovery.ps1',
            'cerebro-os/identity/windows/recovery_v1_4_3/Install-CerebroBrowserTransportRecovery.ps1',
            'cerebro-os/identity/windows/recovery_v1_5/Install-CerebroBrowserMetadataRecovery.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file parse failed: $errors" }
          }
      - name: Test Windows transport and recovery
        run: python -m unittest discover -s cerebro-os/tests -p "test_browser_bridge*" -v
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s cerebro-os/tests -v
      - name: Validate Windows Browser Bridge PowerShell V1
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -Command '& {
            $files = @(
              "cerebro-os/identity/windows/Start-CerebroBrowserBridge.ps1",
              "cerebro-os/identity/windows/CerebroBrowserBridgeService.ps1",
              "cerebro-os/identity/windows/CerebroBrowserTransport.ps1"
            )
            foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Error $_.Message }
                exit 1
              }
            }
          }'
          tmpdir="$(mktemp -d)"
          port=18765
          pwsh -NoProfile -File cerebro-os/identity/windows/CerebroBrowserBridgeService.ps1 -Port "$port" -StatePath "$tmpdir/state.json" -TransportKey "ci-test-key" >"$tmpdir/stdout.log" 2>"$tmpdir/stderr.log" &
          pid=$!
          cleanup() { kill "$pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${port}/health" >"$tmpdir/health.json"; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != "1" ]; then
            cat "$tmpdir/stdout.log" || true
            cat "$tmpdir/stderr.log" || true
            exit 1
          fi
          python - "$tmpdir/health.json" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1],encoding="utf-8-sig"))
          assert payload["status"]=="GREEN", payload
          assert payload["service"]=="CEREBRO Browser Bridge", payload
          assert payload["cloud_transport_status"]=="NOT_CONFIGURED", payload
          assert payload["paired"] is False, payload
          PY
          curl --fail --silent --get "http://127.0.0.1:${port}/pair" \
            --data-urlencode "company_id=fenix" \
            --data-urlencode "profile_id=chrome-default" \
            --data-urlencode "browser_family=CHROME" \
            --data-urlencode "environment=LAB" \
            --data-urlencode "version=v0" >"$tmpdir/pair.html"
          grep -q "PC emparejado localmente" "$tmpdir/pair.html"
          curl --fail --silent "http://127.0.0.1:${port}/health" >"$tmpdir/health2.json"
          python - "$tmpdir/health2.json" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1],encoding="utf-8-sig"))
          assert payload["paired"] is True, payload
          assert payload["company_id"]=="fenix", payload
          assert payload["profile_id"]=="chrome-default", payload
          assert payload["environment"]=="LAB", payload
          PY
          mkdir -p "$tmpdir/chrome/Default" "$tmpdir/chrome/Profile 1"
          cat > "$tmpdir/chrome/Local State" <<'JSON'
          {"profile":{"last_used":"Profile 1","info_cache":{"Default":{"name":"Persona 1"},"Profile 1":{"name":"Trabajo"}}}}
          JSON
          cleanup
          CEREBRO_CHROME_USER_DATA_DIR="$tmpdir/chrome" pwsh -NoProfile -File cerebro-os/identity/windows/CerebroBrowserBridgeService.ps1 -Port "$port" -StatePath "$tmpdir/state2.json" -TransportKey "ci-test-key" >"$tmpdir/stdout2.log" 2>"$tmpdir/stderr2.log" &
          pid=$!
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${port}/health" >/dev/null; then ready=1; break; fi
            sleep 0.2
          done
          test "$ready" = "1"
          curl --fail --silent "http://127.0.0.1:${port}/discover" >"$tmpdir/discover.html"
          grep -q "Deteccion local de Chrome completada" "$tmpdir/discover.html"
          curl --fail --silent --get "http://127.0.0.1:${port}/pair" \
            --data-urlencode "company_id=fenix" \
            --data-urlencode "profile_id=profile 1" \
            --data-urlencode "browser_family=CHROME" \
            --data-urlencode "environment=LAB" \
            --data-urlencode "version=v0" >"$tmpdir/pair2.html"
          curl --fail --silent --get "http://127.0.0.1:${port}/extension/ping" \
            --data-urlencode "extension_id=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" >"$tmpdir/ext.json"
          curl --fail --silent --get "http://127.0.0.1:${port}/transport/status" \
            --data-urlencode "transport_key=ci-test-key" \
            --data-urlencode "status=ONLINE" >"$tmpdir/transport.json"
          curl --fail --silent --get "http://127.0.0.1:${port}/cloud/enqueue" \
            --data-urlencode "transport_key=ci-test-key" \
            --data-urlencode "command_id=ci-cloud-1" \
            --data-urlencode "action=OPEN_LOCAL_TEST_PAGE" >"$tmpdir/enqueue.json"
          curl --fail --silent --get "http://127.0.0.1:${port}/extension/command" \
            --data-urlencode "extension_id=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" >"$tmpdir/command.json"
          curl --fail --silent --get "http://127.0.0.1:${port}/extension/result" \
            --data-urlencode "extension_id=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            --data-urlencode "command_id=ci-cloud-1" \
            --data-urlencode "result=COMPLETED" >"$tmpdir/result.json"
          curl --fail --silent "http://127.0.0.1:${port}/health" >"$tmpdir/health3.json"
          python - "$tmpdir/health3.json" "$tmpdir/ext.json" "$tmpdir/transport.json" "$tmpdir/enqueue.json" "$tmpdir/command.json" "$tmpdir/result.json" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1],encoding="utf-8-sig"))
          ext=json.load(open(sys.argv[2],encoding="utf-8-sig"))
          transport=json.load(open(sys.argv[3],encoding="utf-8-sig"))
          enqueue=json.load(open(sys.argv[4],encoding="utf-8-sig"))
          command=json.load(open(sys.argv[5],encoding="utf-8-sig"))
          result=json.load(open(sys.argv[6],encoding="utf-8-sig"))
          assert payload["browser_discovery_status"]=="GREEN", payload
          assert payload["chrome_last_used_profile"]=="Profile 1", payload
          dirs={x["profile_directory"] for x in payload["chrome_profiles"]}
          assert dirs=={"Default","Profile 1"}, payload
          assert payload["profile_id"]=="Profile 1", payload
          assert payload["extension_status"]=="CONNECTED", payload
          assert payload["extension_id"]=="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", payload
          assert ext["status"]=="GREEN", ext
          assert ext["decision"]=="EXTENSION_HEARTBEAT_ACCEPTED", ext
          assert ext["external_mutation_allowed"] is False, ext
          assert ext["cloud_transport_configured"] is False, ext
          assert transport["decision"]=="TRANSPORT_STATUS_ACCEPTED", transport
          assert enqueue["decision"]=="REMOTE_COMMAND_ENQUEUED", enqueue
          assert command["decision"]=="LAB_COMMAND_AVAILABLE", command
          assert command["command_id"]=="ci-cloud-1", command
          assert command["external_mutation_allowed"] is False, command
          assert result["decision"]=="LAB_COMMAND_RECEIPT_ACCEPTED", result
          assert payload["cloud_transport_status"]=="ONLINE", payload
          assert payload["cloud_transport_configured"] is True, payload
          assert payload["lab_command_status"]=="COMPLETED", payload
          assert payload["lab_command_evidence"]=="LOCAL_TEST_PAGE_OPENED", payload
          PY
          node --check cerebro-os/identity/chrome_extension_v1_2/service_worker.js
          node --check cerebro-os/identity/chrome_extension_v1_4/service_worker.js
          python - <<'PY'
          import json
          manifest=json.load(open("cerebro-os/identity/chrome_extension_v1_2/manifest.json",encoding="utf-8"))
          assert manifest["manifest_version"]==3
          assert manifest["version"]=="1.2.0"
          assert manifest["permissions"]==["alarms"]
          assert manifest["host_permissions"]==["http://127.0.0.1/*"]
          assert "tabs" not in manifest["permissions"]
          assert "scripting" not in manifest["permissions"]
          manifest14=json.load(open("cerebro-os/identity/chrome_extension_v1_4/manifest.json",encoding="utf-8"))
          assert manifest14["version"]=="1.4.0"
          assert manifest14["permissions"]==["alarms"]
          assert manifest14["host_permissions"]==["http://127.0.0.1/*"]
          PY
          trap - EXIT
          cleanup

      - name: Runtime boot and rollback rehearsal
        run: python cerebro-os/runtime/runtime_rehearsal.py
      - name: Non-destructive release rollback rehearsal
        run: python cerebro-os/runtime/release_rollback_rehearsal.py
      - name: Smoke scaffold
        run: |
          tmpdir="$(mktemp -d)"
          python cerebro-os/factory/factory.py SMOKE-001 "Smoke Engine" "$tmpdir"
          test -f "$tmpdir/engines/SMOKE-001/manifest.json"
      - name: Physical isolated PREPROD container rehearsal
        run: |
          docker build -f cerebro-os/preprod/Dockerfile -t cerebro-advisory-preprod:${GITHUB_SHA} .
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e CEREBRO_ENV=PREPROD \
            -e CEREBRO_PREPROD_MODE=ephemeral_rehearsal \
            -e CEREBRO_EXTERNAL_WRITES=disabled \
            -e CEREBRO_APP_CRM_ACCESS=disabled \
            -e CEREBRO_PROD_CREDENTIALS=disabled \
            -e CEREBRO_CUSTOMER_DATA=disabled \
            cerebro-advisory-preprod:${GITHUB_SHA}
