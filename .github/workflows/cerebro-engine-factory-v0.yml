name: CEREBRO Engine Factory V0

on:
  push:
    branches:
      - cerebro-engine-factory-v0
  pull_request:
    paths:
      - 'cerebro-os/**'
      - '.github/workflows/cerebro-engine-factory-v0.yml'
      - '.github/workflows/cerebro-forge-preprod.yml'

permissions:
  contents: read

concurrency:
  group: cerebro-engine-factory-v0-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s cerebro-os/tests -v
      - name: Validate Windows Browser Bridge PowerShell V1
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -Command '& {
            $files = @(
              "cerebro-os/identity/windows/Start-CerebroBrowserBridge.ps1",
              "cerebro-os/identity/windows/CerebroBrowserBridgeService.ps1"
            )
            foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Error $_.Message }
                exit 1
              }
            }
          }'
          tmpdir="$(mktemp -d)"
          port=18765
          pwsh -NoProfile -File cerebro-os/identity/windows/CerebroBrowserBridgeService.ps1 -Port "$port" -StatePath "$tmpdir/state.json" >"$tmpdir/stdout.log" 2>"$tmpdir/stderr.log" &
          pid=$!
          cleanup() { kill "$pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${port}/health" >"$tmpdir/health.json"; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != "1" ]; then
            cat "$tmpdir/stdout.log" || true
            cat "$tmpdir/stderr.log" || true
            exit 1
          fi
          python - "$tmpdir/health.json" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1],encoding="utf-8-sig"))
          assert payload["status"]=="GREEN", payload
          assert payload["service"]=="CEREBRO Browser Bridge", payload
          assert payload["cloud_transport_status"]=="NOT_CONFIGURED", payload
          assert payload["paired"] is False, payload
          PY
          curl --fail --silent --get "http://127.0.0.1:${port}/pair" \
            --data-urlencode "company_id=fenix" \
            --data-urlencode "profile_id=chrome-default" \
            --data-urlencode "browser_family=CHROME" \
            --data-urlencode "environment=LAB" \
            --data-urlencode "version=v0" >"$tmpdir/pair.html"
          grep -q "PC emparejado localmente" "$tmpdir/pair.html"
          curl --fail --silent "http://127.0.0.1:${port}/health" >"$tmpdir/health2.json"
          python - "$tmpdir/health2.json" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1],encoding="utf-8-sig"))
          assert payload["paired"] is True, payload
          assert payload["company_id"]=="fenix", payload
          assert payload["profile_id"]=="chrome-default", payload
          assert payload["environment"]=="LAB", payload
          PY
          mkdir -p "$tmpdir/chrome/Default" "$tmpdir/chrome/Profile 1"
          cat > "$tmpdir/chrome/Local State" <<'JSON'
          {"profile":{"last_used":"Profile 1","info_cache":{"Default":{"name":"Persona 1"},"Profile 1":{"name":"Trabajo"}}}}
          JSON
          cleanup
          CEREBRO_CHROME_USER_DATA_DIR="$tmpdir/chrome" pwsh -NoProfile -File cerebro-os/identity/windows/CerebroBrowserBridgeService.ps1 -Port "$port" -StatePath "$tmpdir/state2.json" >"$tmpdir/stdout2.log" 2>"$tmpdir/stderr2.log" &
          pid=$!
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${port}/health" >/dev/null; then ready=1; break; fi
            sleep 0.2
          done
          test "$ready" = "1"
          curl --fail --silent "http://127.0.0.1:${port}/discover" >"$tmpdir/discover.html"
          grep -q "Deteccion local de Chrome completada" "$tmpdir/discover.html"
          curl --fail --silent "http://127.0.0.1:${port}/health" >"$tmpdir/health3.json"
          python - "$tmpdir/health3.json" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1],encoding="utf-8-sig"))
          assert payload["browser_discovery_status"]=="GREEN", payload
          assert payload["chrome_last_used_profile"]=="Profile 1", payload
          dirs={x["profile_directory"] for x in payload["chrome_profiles"]}
          assert dirs=={"Default","Profile 1"}, payload
          PY
          trap - EXIT
          cleanup

      - name: Runtime boot and rollback rehearsal
        run: python cerebro-os/runtime/runtime_rehearsal.py
      - name: Non-destructive release rollback rehearsal
        run: python cerebro-os/runtime/release_rollback_rehearsal.py
      - name: Smoke scaffold
        run: |
          tmpdir="$(mktemp -d)"
          python cerebro-os/factory/factory.py SMOKE-001 "Smoke Engine" "$tmpdir"
          test -f "$tmpdir/engines/SMOKE-001/manifest.json"
      - name: Physical isolated PREPROD container rehearsal
        run: |
          docker build -f cerebro-os/preprod/Dockerfile -t cerebro-advisory-preprod:${GITHUB_SHA} .
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e CEREBRO_ENV=PREPROD \
            -e CEREBRO_PREPROD_MODE=ephemeral_rehearsal \
            -e CEREBRO_EXTERNAL_WRITES=disabled \
            -e CEREBRO_APP_CRM_ACCESS=disabled \
            -e CEREBRO_PROD_CREDENTIALS=disabled \
            -e CEREBRO_CUSTOMER_DATA=disabled \
            cerebro-advisory-preprod:${GITHUB_SHA}
