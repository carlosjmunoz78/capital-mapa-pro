name: CEREBRO Browser Cloud ACK Lease Alignment
on:
  pull_request:
    branches: [cerebro-engine-factory-v0]
    paths:
      - "cerebro-os/identity/transport_preprod/CerebroBrowserTransport-v143.ps1"
      - "cerebro-os/identity/transport_preprod/cerebro-device-gateway-preprod-v6.ts"
      - "cerebro-os/tests/test_browser_ack_lease_alignment_v143.py"
      - ".github/workflows/cerebro-browser-cloud-ack-v143.yml"
  push:
    branches: [fix/browser-cloud-ack-lease-alignment-v143]
jobs:
  linux:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s cerebro-os/tests -p test_browser_ack_lease_alignment_v143.py -v
  windows-powershell:
    runs-on: windows-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Parse staged transport on Windows PowerShell 5.1
        shell: powershell
        run: |
          $t=$null;$e=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "cerebro-os/identity/transport_preprod/CerebroBrowserTransport-v143.ps1"),[ref]$t,[ref]$e)
          if($e.Count -gt 0){$e | Format-List;exit 1}
      - run: python -m unittest discover -s cerebro-os/tests -p test_browser_ack_lease_alignment_v143.py -v
