name: CEREBRO FORGE PREPROD

on:
  workflow_dispatch:
  push:
    branches:
      - cerebro-engine-factory-v0
    paths:
      - 'cerebro-os/**'
      - '.github/workflows/cerebro-forge-preprod.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: cerebro-forge-preprod-europe-southwest1-cerebro-advisory-preprod
  cancel-in-progress: false

env:
  PROJECT_ID: cerebro-forge
  PROJECT_NUMBER: '15609183753'
  REGION: europe-southwest1
  SERVICE_NAME: cerebro-advisory-preprod
  REPOSITORY: cerebro-forge
  RUNTIME_SERVICE_ACCOUNT: cerebro-forge-runtime@cerebro-forge.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/15609183753/locations/global/workloadIdentityPools/github-cerebro-forge/providers/github-provider
  DEPLOY_SERVICE_ACCOUNT: cerebro-forge-deployer@cerebro-forge.iam.gserviceaccount.com

jobs:
  deploy-preprod:
    # Repository-level readiness is set ONLY after an existing same-project,
    # authenticated private canary invoker is proven in a real execution.
    # Unset => SKIPPED before runner allocation, saving builds/registry uploads
    # and Cloud Run revisions that cannot pass the remote-log evidence gate.
    # This is not a waiver: downstream D1/identity/observability gates remain.
    if: ${{ vars.CEREBRO_FORGE_INTERNAL_CANARY_READY == 'true' }}
    runs-on: ubuntu-latest
    environment: PREPROD
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify FORGE target
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud config get-value project)" = "$PROJECT_ID"
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          test "$ACTIVE_ACCOUNT" = "$DEPLOY_SERVICE_ACCOUNT"

      - name: Ensure Artifact Registry repository exists
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud artifacts repositories describe "$REPOSITORY" --location="$REGION" >/dev/null 2>&1; then
            gcloud artifacts repositories create "$REPOSITORY" \
              --repository-format=docker \
              --location="$REGION" \
              --description="CEREBRO FORGE PREPROD images"
          fi

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Preserve exact PREPROD rollback revision
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --region="$REGION" --format=json > /tmp/before-forge.json
          python - <<'PY'
          import json,os
          traffic=(json.load(open('/tmp/before-forge.json')).get('status') or {}).get('traffic') or []
          serving=[t for t in traffic if t.get('percent',0)>0]
          if len(serving)!=1 or serving[0].get('percent')!=100 or not serving[0].get('revisionName'):
              raise SystemExit('HOLD: original PREPROD traffic must be one verified 100% revision')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PREVIOUS_REVISION='+serving[0]['revisionName']+'\n')
          PY

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/cerebro-advisory-preprod:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -f cerebro-os/preprod/Dockerfile -t "$IMAGE" .

      - name: Run isolated container rehearsal before deploy
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e CEREBRO_ENV=PREPROD \
            -e CEREBRO_PREPROD_MODE=ephemeral_rehearsal \
            -e CEREBRO_EXTERNAL_WRITES=disabled \
            -e CEREBRO_APP_CRM_ACCESS=disabled \
            -e CEREBRO_PROD_CREDENTIALS=disabled \
            -e CEREBRO_CUSTOMER_DATA=disabled \
            "$IMAGE"

      - name: Persistent candidate startup smoke before push
        shell: bash
        run: |
          set -euo pipefail
          CID="$(docker run -d             --network none             --read-only             --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m             --cap-drop ALL             --security-opt no-new-privileges             -e CEREBRO_ENV=PREPROD             -e CEREBRO_PREPROD_MODE=persistent_candidate             -e CEREBRO_EXTERNAL_WRITES=disabled             -e CEREBRO_APP_CRM_ACCESS=disabled             -e CEREBRO_PROD_CREDENTIALS=disabled             -e CEREBRO_CUSTOMER_DATA=disabled             -e PORT=8080             "$IMAGE")"
          cleanup() {
            docker logs "$CID" || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if ! docker inspect "$CID" --format '{{.State.Running}}' | grep -q true; then
              echo "Persistent candidate exited before readiness"
              exit 1
            fi
            if docker exec "$CID" python - <<'PY'
          import urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=1) as response:
              if response.status != 200:
                  raise SystemExit(1)
          PY
            then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          trap - EXIT
          cleanup

      - name: Push immutable image and pin exact registry digest
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          EXPECTED_DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)')"
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          IMAGE_REPO="${IMAGE%:*}"
          IMAGE_CANONICAL="${IMAGE_REPO}@${EXPECTED_DIGEST}"
          echo "IMAGE_CANONICAL=$IMAGE_CANONICAL" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$EXPECTED_DIGEST" >> "$GITHUB_ENV"

      - name: Deploy private Cloud Run PREPROD candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGE_CANONICAL" \
            --no-traffic \
            --region="$REGION" \
            --platform=managed \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --no-allow-unauthenticated \
            --ingress=internal \
            --min-instances=0 \
            --max-instances=1 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=1 \
            --timeout=300 \
            --set-env-vars=CEREBRO_ENV=PREPROD,CEREBRO_PREPROD_MODE=persistent_candidate,CEREBRO_EXTERNAL_WRITES=disabled,CEREBRO_APP_CRM_ACCESS=disabled,CEREBRO_PROD_CREDENTIALS=disabled,CEREBRO_CUSTOMER_DATA=disabled \
            --quiet
          DEPLOY_RC=$?
          set -e
          if [ "$DEPLOY_RC" -ne 0 ]; then
            echo "Cloud Run deploy failed; collecting revision diagnostics"
            FAILED_REVISION="$(gcloud run revisions list \
              --service="$SERVICE_NAME" \
              --region="$REGION" \
              --sort-by='~metadata.creationTimestamp' \
              --limit=1 \
              --format='value(metadata.name)' || true)"
            echo "FAILED_REVISION=$FAILED_REVISION"
            if [ -n "$FAILED_REVISION" ]; then
              gcloud run revisions describe "$FAILED_REVISION" \
                --region="$REGION" \
                --format=json > /tmp/failed-revision.json || true
              cat /tmp/failed-revision.json || true
              gcloud logging read \
                "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE_NAME\" AND resource.labels.revision_name=\"$FAILED_REVISION\"" \
                --limit=100 \
                --order=asc \
                --format=json > /tmp/failed-revision-logs.json || true
              cat /tmp/failed-revision-logs.json || true
            fi
            exit "$DEPLOY_RC"
          fi

      - name: Verify revision and isolation contract
        shell: bash
        run: |
          set -euo pipefail
          REVISION="$(gcloud run services describe "$SERVICE_NAME" --region="$REGION" --format='value(status.latestCreatedRevisionName)')"
          test -n "$REVISION"

          IMAGE_DEPLOYED="$(gcloud run revisions describe "$REVISION" --region="$REGION" --format='value(spec.containers[0].image)')"
          # Image is pinned at push; never re-resolve mutable tags during acceptance.
          test -n "$IMAGE_CANONICAL"
          # Cloud Run resolves an OCI index to its linux/amd64 child manifest.
          # The child is acceptable ONLY if it is cryptographically listed by the pinned index.
          if [ "$IMAGE_DEPLOYED" != "$IMAGE_CANONICAL" ]; then
            export IMAGE_DEPLOYED
            OCI_URL="https://${REGION}-docker.pkg.dev/v2/${PROJECT_ID}/${REPOSITORY}/cerebro-advisory-preprod/manifests/${IMAGE_DIGEST}"
            AUTH="$(gcloud auth print-access-token)"
            curl --fail --silent --show-error --max-time 20 --max-redirs 0 \
              -H "Authorization: Bearer $AUTH" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "$OCI_URL" > /tmp/forge-oci-index.json
            unset AUTH
            python - <<'PY'
          import json, os
          manifest=json.load(open('/tmp/forge-oci-index.json',encoding='utf-8'))
          allowed={'application/vnd.oci.image.index.v1+json','application/vnd.docker.distribution.manifest.list.v2+json'}
          expected=os.environ['IMAGE_CANONICAL']
          deployed=os.environ['IMAGE_DEPLOYED']
          index=os.environ['IMAGE_DIGEST']
          if manifest.get('mediaType') not in allowed or not expected.endswith('@'+index):
              raise SystemExit('HOLD: unexpected OCI index or digest')
          repository=expected.split('@',1)[0]
          if not deployed.startswith(repository+'@sha256:'):
              raise SystemExit('HOLD: different repository or invalid child reference')
          child=deployed.split('@',1)[1]
          children=[x for x in manifest.get('manifests',[]) if x.get('digest')==child
            and x.get('platform',{}).get('os')=='linux' and x.get('platform',{}).get('architecture')=='amd64']
          if len(children)!=1:
              raise SystemExit('HOLD: deployed digest is not the single linux/amd64 child of pinned OCI index')
          print('Verified pinned OCI index → exact linux/amd64 Cloud Run child:',child)
          PY
          fi
          gcloud run services describe "$SERVICE_NAME" --region="$REGION" --format=json > /tmp/forge-candidate-traffic.json
          python - <<'PY'
          import json,os
          state=json.load(open('/tmp/forge-candidate-traffic.json'))
          traffic=[t for t in (state.get('status') or {}).get('traffic',[]) if t.get('percent',0)>0]
          if len(traffic)!=1 or traffic[0].get('percent')!=100 or traffic[0].get('revisionName')!=os.environ['PREVIOUS_REVISION']:
              raise SystemExit('HOLD: candidate traffic before passing gates or concurrent mutation')
          PY

          gcloud run revisions describe "$REVISION" --region="$REGION" --format=json > /tmp/forge-revision.json
          python - <<'PY'
          import json, os
          with open('/tmp/forge-revision.json', encoding='utf-8') as fh:
              revision = json.load(fh)
          spec = revision.get('spec') or {}
          actual_sa = spec.get('serviceAccountName') or spec.get('serviceAccount')
          expected_sa = os.environ['RUNTIME_SERVICE_ACCOUNT']
          if actual_sa != expected_sa:
              raise SystemExit(f'runtime service account mismatch: {actual_sa!r} != {expected_sa!r}')
          containers = spec.get('containers') or []
          if len(containers) != 1:
              raise SystemExit(f'expected exactly one container, got {len(containers)}')
          actual_env = {item.get('name'): item.get('value') for item in containers[0].get('env', [])}
          expected_env = {
              'CEREBRO_ENV': 'PREPROD',
              'CEREBRO_PREPROD_MODE': 'persistent_candidate',
              'CEREBRO_EXTERNAL_WRITES': 'disabled',
              'CEREBRO_APP_CRM_ACCESS': 'disabled',
              'CEREBRO_PROD_CREDENTIALS': 'disabled',
              'CEREBRO_CUSTOMER_DATA': 'disabled',
          }
          if actual_env != expected_env:
              raise SystemExit(f'environment contract mismatch: {actual_env!r}')
          print('Cloud Run isolation contract verified')
          PY

          echo "REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "Persistent PREPROD revision prepared at 0% traffic: $REVISION"

      - name: Verify persistent remote onboarding rehearsal evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forge-evidence
          FILTER="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${SERVICE_NAME}\" AND resource.labels.revision_name=\"${REVISION}\" AND jsonPayload.marker=\"PERSISTENT_REMOTE_ONBOARDING_REHEARSAL_PASS\""
          for attempt in $(seq 1 12); do
            gcloud logging read "$FILTER" --limit=20 --format=json > /tmp/preprod-remote-rehearsal.json
            if python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(Path('/tmp/preprod-remote-rehearsal.json').read_text(encoding='utf-8') or '[]')
          payloads = [row.get('jsonPayload') or {} for row in rows]
          valid = [
              payload for payload in payloads
              if payload.get('marker') == 'PERSISTENT_REMOTE_ONBOARDING_REHEARSAL_PASS'
              and payload.get('status') == 'PASS'
              and payload.get('environment') == 'PREPROD'
              and payload.get('synthetic_rehearsal') is True
              and payload.get('browser_bridge_used') is False
              and payload.get('computer_use_performed') is False
              and payload.get('external_writes') is False
              and payload.get('app_crm_access') is False
              and payload.get('prod_credentials') is False
              and payload.get('customer_data') is False
          ]
          if not valid:
              print('Waiting for persistent remote onboarding rehearsal evidence')
              raise SystemExit(1)
          evidence = {
              'marker': 'PERSISTENT_REMOTE_ONBOARDING_REHEARSAL_PASS',
              'environment': 'PREPROD',
              'revision': os.environ['REVISION'],
              'synthetic_rehearsal': True,
              'browser_bridge_used': False,
              'computer_use_performed': False,
              'external_writes': False,
              'prod_claimed': False,
          }
          Path('forge-evidence/preprod-remote-onboarding-rehearsal.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(evidence, sort_keys=True))
          PY
            then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Persistent remote onboarding rehearsal evidence did not become visible"
              exit 1
            fi
            sleep 5
          done

      - name: Verify persistent PREPROD observability coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forge-evidence
          FILTER="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${SERVICE_NAME}\" AND resource.labels.revision_name=\"${REVISION}\" AND jsonPayload.marker=\"PERSISTENT_OBSERVABILITY_PROBE\""
          for attempt in $(seq 1 12); do
            gcloud logging read "$FILTER" --limit=500 --format=json > /tmp/preprod-observability.json
            if python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, 'cerebro-os')
          from advisory.capabilities import CAPABILITY_REGISTRY

          rows = json.loads(Path('/tmp/preprod-observability.json').read_text(encoding='utf-8') or '[]')
          expected_engines = sorted({engine for capability in CAPABILITY_REGISTRY.values() for engine in capability.engine_ids})
          expected_kinds = {'log', 'metric', 'incident'}
          seen = {
              (
                  (row.get('jsonPayload') or {}).get('engine_id'),
                  (row.get('jsonPayload') or {}).get('kind'),
              )
              for row in rows
          }
          missing = [
              (engine, kind)
              for engine in expected_engines
              for kind in expected_kinds
              if (engine, kind) not in seen
          ]
          if missing:
              print(f'Waiting for Cloud Logging ingestion; missing={len(missing)}')
              raise SystemExit(1)
          evidence = {
              'marker': 'PERSISTENT_OBSERVABILITY_PROBE',
              'environment': 'PREPROD',
              'revision': os.environ['REVISION'],
              'engine_count': len(expected_engines),
              'kinds': sorted(expected_kinds),
              'expected_event_count': len(expected_engines) * len(expected_kinds),
              'observed_pairs': len(seen),
              'prod_claimed': False,
          }
          Path('forge-evidence/preprod-observability.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(evidence, sort_keys=True))
          PY
            then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Persistent PREPROD observability evidence did not become complete"
              exit 1
            fi
            sleep 5
          done

      - name: Capture evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forge-evidence
          {
            echo "project_id=$PROJECT_ID"
            echo "project_number=$PROJECT_NUMBER"
            echo "region=$REGION"
            echo "service=$SERVICE_NAME"
            echo "revision=$REVISION"
            echo "image=$IMAGE"
            echo "image_digest=$IMAGE_DIGEST"
            echo "runtime_service_account=$RUNTIME_SERVICE_ACCOUNT"
            echo "external_writes=disabled"
            echo "app_crm_access=disabled"
            echo "prod_credentials=disabled"
            echo "customer_data=disabled"
            echo "remote_onboarding_rehearsal=PASS"
            echo "remote_onboarding_rehearsal_synthetic=true"
            echo "browser_bridge_used=false"
            echo "computer_use_performed=false"
            echo "github_sha=$GITHUB_SHA"
          } > forge-evidence/preprod-deployment.txt

      - name: Promote only fully accepted PREPROD revision
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --region="$REGION" --format=json > /tmp/forge-gate.json
          python - <<'PY'
          import json,os
          state=json.load(open('/tmp/forge-gate.json'))
          traffic=[t for t in (state.get('status') or {}).get('traffic',[]) if t.get('percent',0)>0]
          if len(traffic)!=1 or traffic[0].get('percent')!=100 or traffic[0].get('revisionName')!=os.environ['PREVIOUS_REVISION']:
              raise SystemExit('HOLD: serving revision changed before promotion')
          PY
          if ! gcloud run services update-traffic "$SERVICE_NAME" --region="$REGION" \
               --to-revisions "$REVISION=100" --quiet; then
            gcloud run services update-traffic "$SERVICE_NAME" --region="$REGION" \
              --to-revisions "$PREVIOUS_REVISION=100" --quiet || true
            exit 1
          fi
          gcloud run services describe "$SERVICE_NAME" --region="$REGION" --format=json > /tmp/forge-promoted.json
          if ! python - <<'PY'
          import json,os
          state=json.load(open('/tmp/forge-promoted.json'))
          traffic=[t for t in (state.get('status') or {}).get('traffic',[]) if t.get('percent',0)>0]
          if len(traffic)!=1 or traffic[0].get('percent')!=100 or traffic[0].get('revisionName')!=os.environ['REVISION']:
              raise SystemExit('PROMOTION_TRAFFIC_MISMATCH')
          PY
          then
            gcloud run services update-traffic "$SERVICE_NAME" --region="$REGION" \
              --to-revisions "$PREVIOUS_REVISION=100" --quiet || true
            exit 1
          fi
          echo "Verified PREPROD revision serving 100%: $REVISION"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-forge-preprod-${{ github.sha }}
          path: forge-evidence/
          if-no-files-found: error
