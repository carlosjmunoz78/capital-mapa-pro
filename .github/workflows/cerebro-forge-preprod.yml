name: CEREBRO FORGE PREPROD

on:
  workflow_dispatch:
  push:
    branches:
      - cerebro-engine-factory-v0
    paths:
      - 'cerebro-os/**'
      - '.github/workflows/cerebro-forge-preprod.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: cerebro-forge
  PROJECT_NUMBER: '15609183753'
  REGION: europe-southwest1
  SERVICE_NAME: cerebro-advisory-preprod
  REPOSITORY: cerebro-forge
  RUNTIME_SERVICE_ACCOUNT: cerebro-forge-runtime@cerebro-forge.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/15609183753/locations/global/workloadIdentityPools/github-cerebro-forge/providers/github-provider
  DEPLOY_SERVICE_ACCOUNT: cerebro-forge-deployer@cerebro-forge.iam.gserviceaccount.com

jobs:
  deploy-preprod:
    runs-on: ubuntu-latest
    environment: PREPROD

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify FORGE target
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud config get-value project)" = "$PROJECT_ID"
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          test "$ACTIVE_ACCOUNT" = "$DEPLOY_SERVICE_ACCOUNT"

      - name: Ensure Artifact Registry repository exists
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud artifacts repositories describe "$REPOSITORY" --location="$REGION" >/dev/null 2>&1; then
            gcloud artifacts repositories create "$REPOSITORY" \
              --repository-format=docker \
              --location="$REGION" \
              --description="CEREBRO FORGE PREPROD images"
          fi

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/cerebro-advisory-preprod:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -f cerebro-os/preprod/Dockerfile -t "$IMAGE" .

      - name: Run isolated container rehearsal before deploy
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e CEREBRO_ENV=PREPROD \
            -e CEREBRO_PREPROD_MODE=ephemeral_rehearsal \
            -e CEREBRO_EXTERNAL_WRITES=disabled \
            -e CEREBRO_APP_CRM_ACCESS=disabled \
            -e CEREBRO_PROD_CREDENTIALS=disabled \
            -e CEREBRO_CUSTOMER_DATA=disabled \
            "$IMAGE"

      - name: Push image
        run: docker push "$IMAGE"

      - name: Deploy private Cloud Run PREPROD candidate
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --no-allow-unauthenticated \
            --ingress=internal \
            --min-instances=0 \
            --max-instances=1 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=1 \
            --timeout=300 \
            --set-env-vars=CEREBRO_ENV=PREPROD,CEREBRO_PREPROD_MODE=persistent_candidate,CEREBRO_EXTERNAL_WRITES=disabled,CEREBRO_APP_CRM_ACCESS=disabled,CEREBRO_PROD_CREDENTIALS=disabled,CEREBRO_CUSTOMER_DATA=disabled \
            --quiet

      - name: Verify revision and isolation contract
        shell: bash
        run: |
          set -euo pipefail
          REVISION="$(gcloud run services describe "$SERVICE_NAME" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$REVISION"

          IMAGE_DEPLOYED="$(gcloud run revisions describe "$REVISION" --region="$REGION" --format='value(spec.containers[0].image)')"
          EXPECTED_DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)')"
          test -n "$EXPECTED_DIGEST"
          IMAGE_REPO="${IMAGE%:*}"
          EXPECTED_CANONICAL="${IMAGE_REPO}@${EXPECTED_DIGEST}"
          if [ "$IMAGE_DEPLOYED" != "$IMAGE" ] && [ "$IMAGE_DEPLOYED" != "$EXPECTED_CANONICAL" ]; then
            echo "Unexpected deployed image: $IMAGE_DEPLOYED"
            echo "Expected tag: $IMAGE"
            echo "Expected digest: $EXPECTED_CANONICAL"
            exit 1
          fi

          gcloud run revisions describe "$REVISION" --region="$REGION" --format=json > /tmp/forge-revision.json
          python - <<'PY'
          import json, os
          with open('/tmp/forge-revision.json', encoding='utf-8') as fh:
              revision = json.load(fh)
          spec = revision.get('spec') or {}
          actual_sa = spec.get('serviceAccountName') or spec.get('serviceAccount')
          expected_sa = os.environ['RUNTIME_SERVICE_ACCOUNT']
          if actual_sa != expected_sa:
              raise SystemExit(f'runtime service account mismatch: {actual_sa!r} != {expected_sa!r}')
          containers = spec.get('containers') or []
          if len(containers) != 1:
              raise SystemExit(f'expected exactly one container, got {len(containers)}')
          actual_env = {item.get('name'): item.get('value') for item in containers[0].get('env', [])}
          expected_env = {
              'CEREBRO_ENV': 'PREPROD',
              'CEREBRO_PREPROD_MODE': 'persistent_candidate',
              'CEREBRO_EXTERNAL_WRITES': 'disabled',
              'CEREBRO_APP_CRM_ACCESS': 'disabled',
              'CEREBRO_PROD_CREDENTIALS': 'disabled',
              'CEREBRO_CUSTOMER_DATA': 'disabled',
          }
          if actual_env != expected_env:
              raise SystemExit(f'environment contract mismatch: {actual_env!r}')
          print('Cloud Run isolation contract verified')
          PY

          echo "REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$EXPECTED_DIGEST" >> "$GITHUB_ENV"
          echo "Persistent PREPROD revision: $REVISION"

      - name: Verify persistent PREPROD observability coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forge-evidence
          FILTER="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${SERVICE_NAME}\" AND resource.labels.revision_name=\"${REVISION}\" AND jsonPayload.marker=\"PERSISTENT_OBSERVABILITY_PROBE\""
          for attempt in $(seq 1 12); do
            gcloud logging read "$FILTER" --limit=500 --format=json > /tmp/preprod-observability.json
            if python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, 'cerebro-os')
          from advisory.capabilities import CAPABILITY_REGISTRY

          rows = json.loads(Path('/tmp/preprod-observability.json').read_text(encoding='utf-8') or '[]')
          expected_engines = sorted({engine for capability in CAPABILITY_REGISTRY.values() for engine in capability.engine_ids})
          expected_kinds = {'log', 'metric', 'incident'}
          seen = {
              (
                  (row.get('jsonPayload') or {}).get('engine_id'),
                  (row.get('jsonPayload') or {}).get('kind'),
              )
              for row in rows
          }
          missing = [
              (engine, kind)
              for engine in expected_engines
              for kind in expected_kinds
              if (engine, kind) not in seen
          ]
          if missing:
              print(f'Waiting for Cloud Logging ingestion; missing={len(missing)}')
              raise SystemExit(1)
          evidence = {
              'marker': 'PERSISTENT_OBSERVABILITY_PROBE',
              'environment': 'PREPROD',
              'revision': os.environ['REVISION'],
              'engine_count': len(expected_engines),
              'kinds': sorted(expected_kinds),
              'expected_event_count': len(expected_engines) * len(expected_kinds),
              'observed_pairs': len(seen),
              'prod_claimed': False,
          }
          Path('forge-evidence/preprod-observability.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(evidence, sort_keys=True))
          PY
            then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Persistent PREPROD observability evidence did not become complete"
              exit 1
            fi
            sleep 5
          done

      - name: Capture evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forge-evidence
          {
            echo "project_id=$PROJECT_ID"
            echo "project_number=$PROJECT_NUMBER"
            echo "region=$REGION"
            echo "service=$SERVICE_NAME"
            echo "revision=$REVISION"
            echo "image=$IMAGE"
            echo "image_digest=$IMAGE_DIGEST"
            echo "runtime_service_account=$RUNTIME_SERVICE_ACCOUNT"
            echo "external_writes=disabled"
            echo "app_crm_access=disabled"
            echo "prod_credentials=disabled"
            echo "customer_data=disabled"
            echo "github_sha=$GITHUB_SHA"
          } > forge-evidence/preprod-deployment.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-forge-preprod-${{ github.sha }}
          path: forge-evidence/
          if-no-files-found: error
