name: CEREBRO Improvement Trigger Entrypoint V0
on:
  pull_request:
    paths:
      - "cerebro-os/jobs/continuous_improvement_entrypoint.py"
      - "cerebro-os/config/improvement_companies.lab.json"
      - "tests/test_continuous_improvement_entrypoint.py"
      - ".github/workflows/cerebro-improvement-trigger-entrypoint-v0.yml"
  push:
    branches: [cerebro-improvement-trigger-entrypoint-v0]
permissions:
  contents: read
jobs:
  entrypoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests/test_continuous_improvement_entrypoint.py tests/test_improvement_operations.py tests/test_improvement_fleet_durable.py
