name: CEREBRO minimum core clean build (no deployment)
on:
  pull_request:
    paths:
      - 'cerebro-os/core/minimum/**'
      - 'cerebro-os/factory/cp162/canonical-catalog-data*.mjs'
      - '.github/workflows/cerebro-core-minimum-build.yml'
permissions:
  contents: read
jobs:
  clean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build twice from pinned public source and test extracted archive
        run: python3 cerebro-os/core/minimum/build.py "$RUNNER_TEMP/minimum-core-catalog.zip"
      - name: Test internal catalog execution composition (no live ingress)
        env:
          PYTHONPATH: cerebro-os
        run: python3 -B -m unittest discover -s cerebro-os/core/minimum -p 'test_execute_catalog.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: minimum-core-catalog-preprod
          path: ${{ runner.temp }}/minimum-core-catalog.zip
          retention-days: 3
          if-no-files-found: error
      - name: Build complete integration package and verify extracted contents
        run: python3 -B cerebro-os/core/minimum/build_integration.py "$RUNNER_TEMP/minimum-core-integration.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: minimum-core-integration-acceptance
          path: ${{ runner.temp }}/minimum-core-integration.zip
          retention-days: 3
          if-no-files-found: error
      - name: Verify actual catalog in existing JavaScript runtime
        run: node --test cerebro-os/factory/cp162/canonical-catalog-data.test.mjs
      - name: Verify exact production IAM catalog grant contract (review only)
        run: node --test cerebro-os/core/minimum/catalog-grant-review.test.mjs
