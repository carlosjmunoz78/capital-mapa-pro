name: CEREBRO Improvement Proposal LAB V0
on:
  pull_request:
    paths:
      - "cerebro-os/jobs/generate_improvement_lab_proposals.py"
      - "cerebro-os/jobs/continuous_improvement_entrypoint.py"
      - "tests/test_improvement_proposal_lab.py"
      - ".github/workflows/cerebro-improvement-proposal-lab-v0.yml"
  push:
    branches: [cerebro-improvement-proposal-lab-v0]
permissions:
  contents: read
jobs:
  proposal-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests/test_improvement_proposal_lab.py tests/test_continuous_improvement_entrypoint.py tests/test_improvement_observation_plan.py
