name: CEREBRO Knowledge Obsolescence V0
on:
  pull_request:
    paths:
      - "cerebro-os/jobs/analyze_knowledge_obsolescence.py"
      - "tests/test_knowledge_obsolescence.py"
      - ".github/workflows/cerebro-knowledge-obsolescence-v0.yml"
  push:
    branches: [cerebro-obsolescence-unlearning-v0]
permissions:
  contents: read
jobs:
  obsolescence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests/test_knowledge_obsolescence.py
