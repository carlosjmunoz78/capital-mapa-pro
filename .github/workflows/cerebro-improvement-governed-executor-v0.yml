name: CEREBRO Improvement Governed Executor V0
on:
  pull_request:
    paths:
      - "cerebro-os/learning/improvement_governed_executor.py"
      - "tests/test_improvement_governed_executor.py"
      - ".github/workflows/cerebro-improvement-governed-executor-v0.yml"
  push:
    branches: [cerebro-improvement-governed-executor-v0]
permissions:
  contents: read
jobs:
  governed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests/test_improvement_governed_executor.py tests/test_improvement_fleet_durable.py tests/test_improvement_observability_supervisor.py
