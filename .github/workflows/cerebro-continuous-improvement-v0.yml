name: CEREBRO Continuous Improvement V0

on:
  pull_request:
    paths:
      - "cerebro-os/learning/**"
      - "cerebro-os/multicompany/**"
      - "tests/test_continuous_improvement.py"
      - ".github/workflows/cerebro-continuous-improvement-v0.yml"
  push:
    branches:
      - cerebro-continuous-improvement-v0
    paths:
      - "cerebro-os/learning/**"
      - "cerebro-os/multicompany/**"
      - "tests/test_continuous_improvement.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall cerebro-os
      - name: Continuous improvement tests
        run: python -m unittest -v tests/test_continuous_improvement.py
