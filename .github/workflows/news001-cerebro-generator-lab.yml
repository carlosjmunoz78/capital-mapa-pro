name: NEWS001 · CEREBRO genera diseño completo LAB
on:
  push:
    branches: [cerebro-engine-factory-v0]
    paths:
      - 'cerebro-os/engines/CEREBRO-NEWS-001/editor/**'
      - '.github/workflows/news001-cerebro-generator-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cerebro-reproduce-both-newsletters:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install deterministic HTML parser
        run: python3 -m pip install --disable-pip-version-check 'beautifulsoup4==4.12.3'
      - name: Restore ORIGINAL visual assets from verified source hashes
        shell: bash
        run: |
          set -euo pipefail
          cd cerebro-os/engines/CEREBRO-NEWS-001/editor/assets
          for f in *.b64; do base64 --decode "$f" > "${f%.b64}"; done
          printf '%s\n' \
            '1b1f234f8f0fb90c50a86749020ea58ffee9fe3a47eff1b70db30a16e9f51e9e  logo-fenix-original.png' \
            'a99245613258646b28087666351a101467baa7a4bed83ee0c87c2917b5ba3e20  hero-inmobiliarias.jpg' \
            'd22d113c3c696ca4ff01cb62136266e7a37a71c666234a1be01afa754d9cc0de  hero-particulares.jpg' | sha256sum --check
      - name: Run CEREBRO generator, current verified weekly news, and functional QA
        shell: bash
        run: |
          set -euo pipefail
          cd cerebro-os/engines/CEREBRO-NEWS-001/editor
          python3 tests/test_contratos.py
          python3 tests/test_deepseek_adapter.py
          python3 tests/test_render_deepseek_draft_lab.py
          python3 ejecutar_prueba_semanal.py --date 2026-11-18
          python3 tests/qa_regresion_semanal.py
          python3 tests/test_cerebro_reproduces_full_design.py
          python3 tests/test_links_wordpress_contract.py
      - name: Upload only private LAB output, no emails
        uses: actions/upload-artifact@v4
        with:
          name: news001-cerebro-autogenerated-b2b-b2c-10blocks
          retention-days: 7
          if-no-files-found: error
          path: |
            cerebro-os/engines/CEREBRO-NEWS-001/editor/out/*.html
            cerebro-os/engines/CEREBRO-NEWS-001/editor/out/RESULTADO_PRUEBA.json
            cerebro-os/engines/CEREBRO-NEWS-001/editor/assets/*.png
            cerebro-os/engines/CEREBRO-NEWS-001/editor/assets/*.jpg
