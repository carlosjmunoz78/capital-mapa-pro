name: CEREBRO UMS-001 · Shared runtime SDK contract LAB

on:
  push:
    branches:
      - cerebro-engine-factory-v0
    paths:
      - 'cerebro-os/runtime/ums001_universal_media_client.mjs'
      - 'cerebro-os/tests/ums001_universal_media_client.test.mjs'
      - 'cerebro-os/registry/ums001_multi_runtime_connection_matrix.lab.json'
      - '.github/workflows/cerebro-ums001-runtime-sdk-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run shared runtime IAM, image and owner-hold tests
        run: node --test cerebro-os/tests/ums001_universal_media_client.test.mjs cerebro-os/tests/ums001_registry_owner_hold.test.mjs
