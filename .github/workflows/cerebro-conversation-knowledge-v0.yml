name: CEREBRO Conversation Knowledge V0
on:
  pull_request:
    paths:
      - "cerebro-os/jobs/prepare_conversation_knowledge_candidates.py"
      - "tests/test_conversation_knowledge_candidates.py"
      - ".github/workflows/cerebro-conversation-knowledge-v0.yml"
  push:
    branches: [cerebro-conversation-knowledge-v0]
permissions:
  contents: read
jobs:
  conversation-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests/test_conversation_knowledge_candidates.py
