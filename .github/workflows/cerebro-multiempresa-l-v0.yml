name: CEREBRO Multiempresa L V0
on:
  pull_request:
    paths:
      - "cerebro-os/jobs/build_company_registry_activation.py"
      - "cerebro-os/jobs/verify_tenant_isolation.py"
      - "tests/test_multiempresa_l.py"
      - ".github/workflows/cerebro-multiempresa-l-v0.yml"
  push:
    branches: [cerebro-multiempresa-l-v0]
permissions:
  contents: read
jobs:
  multiempresa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests/test_multiempresa_l.py
