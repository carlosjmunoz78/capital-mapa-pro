name: NEWS001 · Test motor semanal independiente CEREBRO
on:
  push:
    branches: [cerebro/news001-single-optin-lab-20261118]
    paths:
      - 'cerebro-os/engines/CEREBRO-NEWS-001/weekly-live/**'
      - '.github/workflows/news001-weekly-live-tests-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weekly-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: cd cerebro-os/engines/CEREBRO-NEWS-001/weekly-live && deno test --no-check engine.test.ts
