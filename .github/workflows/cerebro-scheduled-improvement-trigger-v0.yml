name: CEREBRO Scheduled Improvement Trigger V0
# observation-envelope-facts-v0 verified

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cerebro-scheduled-improvement-trigger-v0.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: cerebro-scheduled-improvement-trigger-v0
  cancel-in-progress: false

jobs:
  daily-lab-improvement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CEREBRO_IMPROVEMENT_STATE_ROOT: .cerebro-runtime/improvement
      CEREBRO_IMPROVEMENT_EVIDENCE_ROOT: .cerebro-runtime/evidence
      CEREBRO_IMPROVEMENT_COMPANIES: cerebro-os/config/improvement_companies.lab.json
      CEREBRO_IMPROVEMENT_BUSINESS_SOURCES: cerebro-os/config/improvement_business_sources.lab.json
      CEREBRO_IMPROVEMENT_COMPETITOR_SOURCES: cerebro-os/config/improvement_competitor_sources.lab.json
      CEREBRO_IMPROVEMENT_OBSERVATION_STATE_ROOT: .cerebro-runtime/observations
      CEREBRO_IMPROVEMENT_SOURCE_POLICY: cerebro-os/config/improvement_source_policy.lab.json
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout canonical CEREBRO runtime
        uses: actions/checkout@v4
        with:
          ref: cerebro-engine-factory-v0

      - name: Restore latest runtime state artifact if present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cerebro-runtime
          ARTIFACT_ID="$(gh api             "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=cerebro-improvement-runtime-state&per_page=100"             --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .id // empty')"
          if [ -n "$ARTIFACT_ID" ]; then
            curl -fsSL               -H "Authorization: Bearer ${GITHUB_TOKEN}"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"               -o /tmp/cerebro-improvement-state.zip
            unzip -o /tmp/cerebro-improvement-state.zip -d .cerebro-runtime
          else
            echo "No prior runtime state artifact; starting from clean LAB state."
          fi

      - name: Collect real improvement observations
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/collect_improvement_observations.py

      - name: Collect real public business observations
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/collect_business_observations.py

      - name: Collect public competitor observations
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/collect_competitor_observations.py

      - name: Collect runtime FinOps observations
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/collect_finops_observations.py

      - name: Collect public WordPress content observations
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/collect_wordpress_content_observations.py

      - name: Collect SEO local social public footprint
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/collect_public_footprint_observations.py

      - name: Collect public service availability
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/collect_public_service_availability.py

      - name: Aggregate technical and business observations
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/aggregate_improvement_observations.py

      - name: Generate zero-cost LAB proposals
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/generate_improvement_lab_proposals.py

      - name: Ingest LAB proposals into durable priority queue
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/ingest_improvement_proposals.py

      - name: Generate zero-cost candidate contract tests
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/generate_improvement_candidate_tests.py

      - name: Evaluate deterministic candidate specs
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/evaluate_improvement_candidates.py

      - name: Generate LAB candidate tribunal
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/generate_improvement_candidate_tribunal.py

      - name: Compare structural OLD vs NEW candidate
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/compare_improvement_candidate_old_vs_new.py

      - name: Simulate deterministic candidate canary
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/simulate_improvement_candidate_canary.py

      - name: Plan fail-closed promotion or rollback
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/plan_improvement_candidate_promotion.py

      - name: Export CEREBRO Console source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/export_improvement_console_snapshot.py

      - name: Run scheduled LAB improvement worker
        id: run
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/continuous_improvement_entrypoint.py | tee /tmp/cerebro-improvement-result.log
          RESULT="$(tail -n 1 /tmp/cerebro-improvement-result.log)"
          STATUS="$(printf '%s' "$RESULT" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          {
            echo "## CEREBRO scheduled LAB improvement"
            echo
            echo "\`\`\`json"
            echo "$RESULT"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" = "BLOCKED" ] || [ "$STATUS" = "HUMAN_REQUIRED" ]; then
            echo "Fail-closed attention state: $STATUS"
            exit 1
          fi

      - name: Analyze meta-learning from cycle audit
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/analyze_meta_learning.py

      - name: Generate safe meta-learning experiments
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/generate_meta_learning_experiments.py

      - name: Generate Factory Supervisor self-improvement candidates
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/generate_factory_supervisor_self_improvement.py

      - name: Analyze knowledge obsolescence safely
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/analyze_knowledge_obsolescence.py

      - name: Build knowledge revalidation priority queue
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/build_knowledge_revalidation_queue.py

      - name: Verify knowledge revalidation provenance
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/verify_knowledge_revalidation_evidence.py

      - name: Build safe knowledge update candidates
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/build_knowledge_update_candidates.py

      - name: Append safe updates to LAB knowledge ledger
        shell: bash
        run: |
          set -euo pipefail
          python cerebro-os/jobs/apply_knowledge_update_candidates_lab.py

      - name: Persist runtime state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-improvement-runtime-state
          path: .cerebro-runtime/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
