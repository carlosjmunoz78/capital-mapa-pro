name: CEREBRO Improvement Scheduler V0

on:
  pull_request:
    paths:
      - "cerebro-os/jobs/continuous_improvement_schedule.py"
      - "tests/test_continuous_improvement_schedule.py"
      - ".github/workflows/cerebro-improvement-scheduler-v0.yml"
  push:
    branches:
      - cerebro-improvement-scheduler-v0

permissions:
  contents: read

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests/test_continuous_improvement_schedule.py tests/test_continuous_improvement_runtime.py tests/test_continuous_improvement.py
